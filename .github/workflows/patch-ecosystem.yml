name: Patch ecosystem links
on:
  push:
    branches: [ecosystem-links-v3]
    paths:
      - '.github/scripts/patch-ecosystem.py'
      - '.github/workflows/patch-ecosystem.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecosystem-links-v3
      - run: python3 .github/scripts/patch-ecosystem.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: add Dallasite ecosystem footer"
          git push origin HEAD:ecosystem-links-v3
